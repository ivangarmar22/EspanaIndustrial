# Builds the static site and publishes it on GitHub Pages
# (https://ivangarmar22.github.io/EspanaIndustrial/) on every push to main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Commons thumbnails are not versioned: download them once and reuse them while the catalogue is unchanged.
      - uses: actions/cache@v6
        with:
          path: public/media
          key: media-${{ hashFiles('data/catalog/catalog.json') }}
          restore-keys: media-
      - run: npm run data:media
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          NEXT_PUBLIC_DONATE_PAYPAL: ${{ vars.DONATE_PAYPAL }}
          NEXT_PUBLIC_DONATE_BIZUM: ${{ vars.DONATE_BIZUM }}
          NEXT_PUBLIC_DONATE_KOFI: ${{ vars.DONATE_KOFI }}
      # Without this file GitHub Pages runs Jekyll, which drops the _next/ folder.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
